# SPDX-License-Identifier: MIT
#
# The gates docs/12 §6 specifies. That table described this file for months
# before it existed: 290 tests, a forty-screen tour and an accessibility audit
# were in the repository with nothing running them.
#
# A pull request that fails any job does not merge. There are no exceptions for
# "just a small change" (docs/12 §6).
#
# Skips are not passes. A job that cannot do its work on this image (an Xcode
# that cannot open the objectVersion 110 project, no iPhone simulator, a host
# without FoundationModels.framework) fails, unless the repository variable
# ALLOW_SKIP is "true" — then it passes with a yellow warning that names what
# did not run. Set it while the hosted images lag Xcode 27; clear it the day
# they catch up, so a green tick means the work was done.

name: CI

on:
  push:
    branches: [main, "fix/**", "feature/**", "ideas/**", "r2/**"]
  pull_request:

env:
  ALLOW_SKIP: ${{ vars.ALLOW_SKIP == 'true' }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Package logic. Every package builds for all five platforms; running the
  # suites on macOS covers them all, because nothing in them links a UI.
  #
  # macos-26, not macos-15, and for one concrete reason: AlohaIntelligence
  # imports FoundationModels under a canImport guard, but with the 27.0
  # deployment target the link is strong, so the test bundle fails to dlopen
  # on a host that has no FoundationModels.framework — the macos-15 image's
  # macOS 15 host. macos-26 hosts have the framework, so the suites run.
  test:
    name: Package tests (macOS)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest Xcode
        run: |
          latest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          if [ -z "$latest" ]; then echo "No Xcode installed"; exit 1; fi
          sudo xcode-select --switch "$latest/Contents/Developer"
          xcodebuild -version
          swift --version
      # Eight packages, each built by both test jobs on every push, and none
      # of them with a dependency to fetch — so everything worth caching is
      # the compiler's own output. Keyed on the manifests and the sources: a
      # change to either invalidates, anything else restores.
      - name: Cache package build products
        uses: actions/cache@v4
        with:
          path: Packages/*/.build
          key: packages-${{ runner.os }}-${{ hashFiles('Packages/*/Package.swift', 'Packages/*/Sources/**/*.swift') }}
          restore-keys: |
            packages-${{ runner.os }}-
      - name: Test every package
        run: |
          set -o pipefail
          failed=0
          for manifest in Packages/*/Package.swift; do
            package_dir=$(dirname "$manifest")
            scheme=$(basename "$package_dir")
            echo "::group::swift test $package_dir"
            if (cd "$package_dir" && swift test --parallel 2>&1 | tee "$RUNNER_TEMP/package-tests.log"); then
              :
            else
              # The one failure that says nothing about this repository: the
              # suite built fine, but the host OS has no
              # FoundationModels.framework to load at run time. Allowed as a
              # skip only while ALLOW_SKIP is set; otherwise the suite did
              # not run, and that is a failure.
              if grep -q "Library not loaded: .*FoundationModels.framework" "$RUNNER_TEMP/package-tests.log"; then
                message="The suite compiled and linked, but this runner's host OS predates FoundationModels.framework, so the test bundle cannot be loaded."
                if [ "$ALLOW_SKIP" = "true" ]; then
                  echo "::warning title=$scheme tests skipped::$message"
                  echo "::endgroup::"
                  rm -f "$RUNNER_TEMP/package-tests.log"
                  continue
                fi
                echo "::error title=$scheme tests not run::$message Set the repository variable ALLOW_SKIP to true to accept this skip while the runner images lack it."
              fi
              failed=1
            fi
            echo "::endgroup::"
            rm -f "$RUNNER_TEMP/package-tests.log"
          done
          exit $failed

  # Package logic again, on a device simulator, where SwiftUI actually has a
  # trait environment: this is where a colour or a layout crash surfaces.
  test-simulator:
    name: Package tests (iOS simulator)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest Xcode
        run: |
          latest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select --switch "$latest/Contents/Developer"
      - name: Cache package build products
        uses: actions/cache@v4
        with:
          path: Packages/*/.build
          key: packages-sim-${{ runner.os }}-${{ hashFiles('Packages/*/Package.swift', 'Packages/*/Sources/**/*.swift') }}
          restore-keys: |
            packages-sim-${{ runner.os }}-
      - name: Test every package
        run: |
          # iPhone 17 Pro when the image has it, the first available iPhone
          # otherwise — a runner's device list is not a promise. Note that
          # `simctl list -j` puts the per-runtime device lists under a
          # top-level "devices" key: taking the first value of the root and
          # then indexing it with [0] reads the device map itself, which
          # never yields a name no matter what is installed.
          device=$(xcrun simctl list devices available -j | python3 -c '
            import json, sys
            data = json.load(sys.stdin).get("devices", {})
            names = [d["name"] for devices in data.values() for d in devices]
            pick = next((n for n in names if n == "iPhone 17 Pro"), None)
            if not pick:
                pick = next((n for n in names if n.startswith("iPhone")), None)
            if pick:
                print(pick)
          ')
          if [ -z "$device" ]; then
            message="No available iPhone simulator on this runner image, so no package suite can be run under an iOS trait environment."
            if [ "$ALLOW_SKIP" = "true" ]; then
              echo "::warning title=Package tests skipped::$message"
              exit 0
            fi
            echo "::error title=Package tests not run::$message Set the repository variable ALLOW_SKIP to true to accept this skip while the runner images lack it."
            exit 1
          fi
          echo "Testing on $device"
          failed=0
          for manifest in Packages/*/Package.swift; do
            package_dir=$(dirname "$manifest")
            scheme=$(basename "$package_dir")
            echo "::group::xcodebuild test $package_dir"
            if (cd "$package_dir" && xcodebuild test -scheme "$scheme" \
                 -destination "platform=iOS Simulator,name=$device" -quiet 2>&1 \
                 | tee "$RUNNER_TEMP/sim-package-tests.log"); then
              :
            else
              # The intelligence package's tests need FoundationModels.framework
              # at run time, which the host OS has to provide. Where it does
              # not, the suite compiled and linked and the bundle could not be
              # loaded — reported rather than pointed at the code.
              if grep -q "Library not loaded: .*FoundationModels.framework" "$RUNNER_TEMP/sim-package-tests.log"; then
                message="The suite compiled and linked, but this runner's host OS predates FoundationModels.framework, so the test bundle cannot be loaded."
                if [ "$ALLOW_SKIP" = "true" ]; then
                  echo "::warning title=$scheme tests skipped::$message"
                  rm -f "$RUNNER_TEMP/sim-package-tests.log"
                  echo "::endgroup::"
                  continue
                fi
                echo "::error title=$scheme tests not run::$message Set the repository variable ALLOW_SKIP to true to accept this skip while the runner images lack it."
              fi
              failed=1
            fi
            echo "::endgroup::"
            rm -f "$RUNNER_TEMP/sim-package-tests.log"
          done
          exit $failed

  # Every app target, every platform, in the Release configuration that
  # ships, with warnings as errors (docs/12 §1, §6). Signing is off: CI is
  # about the code compiling, not about a certificate nobody should be
  # committing. Release also proves the debug-only pieces (MockAPIServer,
  # MockMode) are not needed by anything that ships.
  #
  # xcode-27, not macos-26: the project is objectVersion 110, which no Xcode
  # on the macos-26 image can open. That image is GitHub's preview of
  # Xcode 27 on a macOS 27 host (actions/runner-images#14404).
  build:
    name: Build (${{ matrix.name }})
    runs-on: xcode-27
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iOS
            scheme: AlohaSocial
            destination: generic/platform=iOS
          - name: macOS
            scheme: AlohaSocialMac
            destination: platform=macOS
          - name: tvOS
            scheme: AlohaSocialTV
            destination: generic/platform=tvOS
          - name: watchOS
            scheme: AlohaSocialWatch
            destination: generic/platform=watchOS
          - name: visionOS
            scheme: AlohaSocial
            destination: generic/platform=visionOS
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest released Xcode
        run: |
          # The image's aliases (Xcode_27.2.app) point at betas, so resolve
          # each one before leaving the betas out.
          latest=$(for app in /Applications/Xcode*.app; do (cd "$app" && pwd -P); done \
            | grep -vi beta | sort -uV | tail -1)
          if [ -z "$latest" ]; then echo "No Xcode installed"; exit 1; fi
          sudo xcode-select --switch "$latest/Contents/Developer"
      - name: Build ${{ matrix.name }}
        env:
          CODE_SIGNING_ALLOWED: "NO"
        run: |
          set -o pipefail
          # Probe first, to a file: `xcodebuild -list` in a command
          # substitution is a tool that crashes on a broken pipe, and this
          # check exists to report an environment limit without that noise.
          if ! xcodebuild -list -quiet -project AlohaSocial.xcodeproj \
              >"$RUNNER_TEMP/xcode-list" 2>&1; then
            if grep -q "future Xcode project file format" "$RUNNER_TEMP/xcode-list"; then
              # Never pipe xcodebuild into head: a closed pipe makes its
              # version handler raise an uncaught NSException (exit 134),
              # which takes the whole script down.
              xcodebuild -version >"$RUNNER_TEMP/xcode-version" 2>&1 || true
              version=$(tr -s ' ' <"$RUNNER_TEMP/xcode-version" | cut -d' ' -f2 | head -1)
              message="AlohaSocial.xcodeproj is objectVersion 110 (Xcode 27) and this image's Xcode $version cannot open that format."
              if [ "$ALLOW_SKIP" = "true" ]; then
                echo "::warning title=Build skipped::$message"
                exit 0
              fi
              echo "::error title=Build not run::$message Set the repository variable ALLOW_SKIP to true to accept this skip while the runner images lack it."
              exit 1
            fi
            cat "$RUNNER_TEMP/xcode-list" >&2
            exit 1
          fi
          # Output goes to a file, never a pipe: xcodebuild aborts with
          # NSFileHandleOperationException (broken pipe) when its stdout's
          # reader disappears, and that abort is indistinguishable from a
          # build failure in the log. The status is taken with `||` because
          # the step runs under `bash -e`.
          status=0
          xcodebuild build \
            -project AlohaSocial.xcodeproj \
            -scheme "${{ matrix.scheme }}" \
            -configuration Release \
            -destination "${{ matrix.destination }}" \
            -quiet \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            GCC_TREAT_WARNINGS_AS_ERRORS=YES \
            >"$RUNNER_TEMP/build-${{ matrix.name }}.log" 2>&1 || status=$?
          cat "$RUNNER_TEMP/build-${{ matrix.name }}.log"
          exit $status

  # The full tour suite: screen presentation, the Skeleton and Media viewer,
  # VoiceOver and Reduce Motion.
  #
  # Two facts about the host decide whether this can run at all, and neither
  # is a statement about the code: the tours launch an app in an objectVersion
  # 110 project (Xcode 27), and they need an iPhone simulator to launch it in.
  # When this image has neither, the job says so and stops — checking both in
  # one script, rather than booting a simulator in one step and failing in the
  # next, which is what a crash mid-job looked like.
  ui:
    name: UI tours (${{ matrix.shard }})
    # xcode-27 for the same reason as the build job.
    runs-on: xcode-27
    # The whole suite is over half an hour on a fast Mac, too close to an
    # hour on a hosted runner; four shards run it in parallel. A test class
    # in no shard would never run, which the first step refuses.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: accessibility
            tests: AccessibilityAuditTests
          - shard: interaction
            tests: InteractionTourTests
          - shard: screens
            tests: AddedScreensTourTests PseudolocalisationTourTests StressTourTests
          - shard: tours
            tests: ScreenTourTests ThemeTourTests SidebarTourTests NativeSidebarTests
    env:
      ALL_SHARDS: >-
        AccessibilityAuditTests InteractionTourTests AddedScreensTourTests
        PseudolocalisationTourTests StressTourTests ScreenTourTests ThemeTourTests
        SidebarTourTests NativeSidebarTests
    steps:
      - uses: actions/checkout@v4
      - name: Every tour class is in a shard
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          sharded = set(os.environ["ALL_SHARDS"].split())
          found = set()
          for path in pathlib.Path("AlohaSocialUITests").glob("*.swift"):
              text = path.read_text()
              # Mac-only suites do not exist in the iOS test bundle.
              if "#if os(macOS)" in "\n".join(text.splitlines()[:8]):
                  continue
              found |= set(re.findall(r"class (\w+)\s*:\s*XCTestCase", text))
          missing = sorted(found - sharded)
          if missing:
              raise SystemExit(f"UI test classes in no shard: {', '.join(missing)}")
          PY
      - name: Select the newest released Xcode
        run: |
          latest=$(for app in /Applications/Xcode*.app; do (cd "$app" && pwd -P); done \
            | grep -vi beta | sort -uV | tail -1)
          if [ -z "$latest" ]; then echo "No Xcode installed"; exit 1; fi
          sudo xcode-select --switch "$latest/Contents/Developer"
      - name: Run the ${{ matrix.shard }} tours
        # Short of the job's limit, so the log step below still has time to
        # say where a stuck run was.
        timeout-minutes: 45
        env:
          CODE_SIGNING_ALLOWED: "NO"
        run: |
          set -u
          skip () {
            if [ "$ALLOW_SKIP" = "true" ]; then
              echo "::warning title=UI tours skipped::$1"
              exit 0
            fi
            echo "::error title=UI tours not run::$1 Set the repository variable ALLOW_SKIP to true to accept this skip while the runner images lack it."
            exit 1
          }

          # 1. An Xcode that cannot open the project cannot run its tests.
          if ! xcodebuild -list -quiet -project AlohaSocial.xcodeproj \
              >"$RUNNER_TEMP/xcode-list" 2>&1; then
            if grep -q "future Xcode project file format" "$RUNNER_TEMP/xcode-list"; then
              skip "AlohaSocial.xcodeproj is objectVersion 110 (Xcode 27) and this image's Xcode cannot open that format. The tours need Xcode 27; when an image ships it, this job runs the suite for real."
            fi
            cat "$RUNNER_TEMP/xcode-list" >&2
            exit 1
          fi

          # 2. An image without an iPhone simulator has nowhere to launch.
          device=$(xcrun simctl list devices available -j | python3 -c '
            import json, sys
            data = json.load(sys.stdin).get("devices", {})
            pick = next((d for devices in data.values() for d in devices
                         if d["name"].startswith("iPhone")), None)
            if pick:
              print(pick["name"])
          ')
          [ -n "$device" ] || skip "No available iPhone simulator on this runner image, so the tours have nowhere to launch. The package suites above still exercise the logic."

          # 3. Booted and settled before the first test: a runner installed
          #    while the simulator is still starting up is killed before it
          #    connects, which reads as a crashed test.
          xcrun simctl boot "$device" 2>/dev/null || true
          xcrun simctl bootstatus "$device" -b >/dev/null

          # 4. Output to a file, never a pipe: xcodebuild aborts with a broken
          #    pipe when its reader disappears, and that abort is
          #    indistinguishable from a test failure. The step runs under
          #    `bash -e`, so the status is taken with `||`: a bare failing
          #    command would end the script before the log is printed
          #    (the step after this one prints it).
          #
          #    Diagnostics collection is off: after a failure it waited ten
          #    minutes on the simulator and then gave up, so a few failures
          #    ran the job into its timeout and the log was never printed.
          #    Each test is capped, one retry absorbs a runner that dies on
          #    launch, and the watchdog stops xcodebuild before the job's
          #    own timeout would, so whatever happened is still printed.
          #    The watchdog is short of the step's 45 minutes, so xcodebuild
          #    stops and writes its result bundle before the step is killed.
          ( sleep 2400; pkill -INT -x xcodebuild ) &
          watchdog=$!
          status=0
          only=()
          for class in ${{ matrix.tests }}; do
            only+=("-only-testing:AlohaSocialUITests/$class")
          done
          xcodebuild test \
            -project AlohaSocial.xcodeproj \
            -scheme AlohaSocialUITests \
            -destination "platform=iOS Simulator,name=$device" \
            "${only[@]}" \
            -resultBundlePath "$RUNNER_TEMP/ui-tours.xcresult" \
            -collect-test-diagnostics never \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 180 \
            -maximum-test-execution-time-allowance 300 \
            -retry-tests-on-failure \
            -test-iterations 2 \
            -quiet \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            >"$RUNNER_TEMP/ui-tours.log" 2>&1 || status=$?
          kill "$watchdog" 2>/dev/null || true
          exit $status
      # Also when the step above failed, timed out or was cancelled: a run
      # that never finished used to leave nothing to say where it stopped.
      - name: Show the tour log
        if: always()
        run: |
          [ -f "$RUNNER_TEMP/ui-tours.log" ] || { echo "No tour log was written."; exit 0; }
          grep -E "Test Case .*(passed|failed)|error: |Executed [0-9]+ tests" \
            "$RUNNER_TEMP/ui-tours.log" || true
          echo "::group::Full log"
          cat "$RUNNER_TEMP/ui-tours.log"
          echo "::endgroup::"
      - name: Keep the result bundle
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: ui-tours-${{ matrix.shard }}
          path: ${{ runner.temp }}/ui-tours.xcresult
          if-no-files-found: ignore
          retention-days: 7

  # A pull request that fails to lint does not merge (docs/12 §6).
  lint:
    name: swift-format (strict)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest Xcode
        run: |
          latest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          if [ -z "$latest" ]; then echo "No Xcode installed"; exit 1; fi
          sudo xcode-select --switch "$latest/Contents/Developer"
      - name: Lint everything
        run: xcrun swift-format lint --recursive --strict .

  # The licence gate: every file carries the SPDX header, and no external
  # dependency has crept in.
  licence:
    name: Licence and dependency gate
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run the gate
        run: python3 tools/check-licence.py

  # The localisation gate: every user-facing string has a translator comment.
  localisation:
    name: Localisation gate
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Every user-facing string has a translator comment
        run: python3 tools/check-localisation.py

  # The other half of docs/12's accessibility gate: every colour role resolves
  # in light, dark and both high-contrast variants, meets WCAG AA, and keeps
  # boost / favourite / bookmark apart under the three colour-vision
  # deficiencies (docs/12 §5). Its own job, so a contrast regression is named
  # as one rather than buried among the package suites.
  design-tokens:
    name: Design tokens (contrast)
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest Xcode
        run: |
          latest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          if [ -z "$latest" ]; then echo "No Xcode installed"; exit 1; fi
          sudo xcode-select --switch "$latest/Contents/Developer"
      - name: Colour roles meet the contrast floor
        run: cd Packages/AlohaDesign && swift test
